<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #657996;
        }

        .container {
            width: 450px;
            margin: 50px auto;
            background: rgb(207, 201, 201);
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 10px 10px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #042049;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #8b8686;
        }

        .gender {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .buttons {
            text-align: center;
            margin-top: 15px;
        }

        button {
            padding: 8px 15px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            background-color: #2c5aa0;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #1e3f73;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Information Form</h2>

    <form>
        <label>Name</label>
        <input type="text" name="name"  pattern="[A-Za-z\s]+" title="Only alphabets are allowed" required>

        <label>Roll No.</label>
        <input type="text" name="rollno" required>

        <label>Branch</label>
        <select name="branch">
            <option>Computer Science</option>
            <option>Mechanical</option>
            <option>Electrical</option>
            <option>Civil</option>
        </select>

        <label>Year of Study</label>
        <select name="year">
            <option>First Year</option>
            <option>Second Year</option>
            <option>Third Year</option>
            <option>Fourth Year</option>
        </select>

        <label>Gender</label>
        <div class="gender">
            <label><input type="radio" name="gender"> Male</label>
            <label><input type="radio" name="gender"> Female</label>
        </div>

        <label>Email</label>
        <input type="email" name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required>

        <label>Phone</label>
        <input type="tel" name="phone" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number ">

        <label>Section</label>
        <textarea rows="1" name="section"></textarea>

        <label>Password</label>
        <input type="password" name="password" pattern="[a-z0-9._%+-]{8,}" title="Password must be at least 6 characters long"required>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>
    </form>
</div>
</body>
</html>
