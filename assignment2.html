<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: rgb(160, 177, 107);
            width: 500px;
            padding: 20px;
            margin-top: 30px;
            border: 2px solid rgb(8, 8, 8);
        }

        .heading {
            display: flex;
            align-items: center;
            background-color: white;
            padding: 10px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .heading h1 {
            font-size: 22px;
            margin-left: 15px;
            text-align: center;
        }

        .section-title {
            background-color: rgb(251, 251, 214);
            text-align: center;
            padding: 10px;
            font-weight: bold;
            margin: 20px 0;
        }

        .form-group {
            margin-bottom: 15px;
            color: white;
        }

        .form-group label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            padding: 5px;
            width: 200px;
        }

        .radio-group {
            color: white;
            margin-bottom: 15px;
        }

        .book-btn {
            display: block;
            margin: 20px auto 0 auto;
            background-color: rgb(3, 33, 3);
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="heading">
            <h1>🚌 Bus Booking System</h1>
        </div>

        <div class="section-title">User Information</div>

        <div class="form-group">
            <label for="uname">User Name:</label>
            <input type="text" id="uname" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="uage">User Age:</label>
            <input type="number" id="uage" placeholder="Enter your age">
        </div>

        <div class="form-group">
            <label for="aadhar">Aadhaar Number:</label>
            <input type="text" id="aadhar" placeholder="Enter Aadhaar number">
        </div>

        <div class="form-group">
            <label for="city">Select Your City:</label>
            <select id="city">
                <option value="delhi">Delhi</option>
                <option value="mumbai">Mumbai</option>
                <option value="pune">Pune</option>
                <option value="jaipur">Jaipur</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Select Date:</label>
            <input type="date" id="date">
        </div>

        <div class="section-title">Bus Information</div>

        <div class="form-group">
            <label for="destination">Select Destination:</label>
            <select id="destination">
                <option value="delhi">Delhi</option>
                <option value="mumbai">Mumbai</option>
                <option value="pune">Pune</option>
                <option value="jaipur">Jaipur</option>
            </select>
        </div>

        <div class="radio-group">
            <p>Select your Bus Type:</p>
            <input type="radio" name="busType" id="acBus" value="2000">
            <label for="acBus">AC Bus: 2000</label>
            <br>
            <input type="radio" name="busType" id="nonAcBus" value="1500">
            <label for="nonAcBus">Non-AC Bus: 1500</label>
        </div>

        <div class="form-group">
            <label for="seat">Select your Seat:</label>
            <select id="seat">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>

        <button class="book-btn">Book Now</button>

    </div>

</body>
</html>
