<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* ---------- Menu Card ---------- */
        .menu-card {
            width: 300px;
            height: 300px;
            background-color: #e9f195;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
            transition: background-color 0.4s ease;
        }

        .menu-card h2 {
            text-align: center;
            margin-top: 0;
        }

        .menu-card ul {
            list-style: none;
            padding: 0;
        }

        .menu-card li {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px dashed #999;
        }

        #buyNowBtn {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #buyNowBtn:hover {
            background-color: #555;
        }

        /* ---------- Order Section ---------- */
        .order-card {
            width: 300px;
            background-color: #ffffff;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .order-card label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        .order-card input {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
            box-sizing: border-box;
        }

        #calculateBtn {
            width: 100%;
            padding: 8px;
            margin-top: 15px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #calculateBtn:hover {
            background-color: #555;
        }

        .result-box {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #999;
            border-radius: 5px;
            text-align: center;
            background-color: #f9f9f9;
        }

        .round-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #ffe0b2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 10px auto;
        }
    </style>
</head>
<body>

    <!-- Menu Card -->
    <div class="menu-card" id="menuCard">
        <h2>Online Shop Menu</h2>
        <ul>
            <li><span>Rice</span><span>₹500</span></li>
            <li><span>Tea</span><span>₹700</span></li>
            <li><span>Coffee</span><span>₹800</span></li>
            <li><span>Pasta</span><span>₹1000</span></li>
            <li><span>Bread</span><span>₹250</span></li>
        </ul>
        <button id="buyNowBtn" onclick="buyNow()">Buy Now</button>
    </div>

    <!-- Order Section (hidden until Buy Now is clicked) -->
    <div class="order-card" id="orderSection">
        <h2>Place Your Order</h2>

        <label for="productName">Enter your product name</label>
        <input type="text" id="productName" placeholder="rice / tea / coffee / pasta / bread">

        <label for="quantity">Enter your quantity</label>
        <input type="number" id="quantity" min="1" placeholder="e.g. 2">

        <button id="calculateBtn" onclick="calculateTotal()">Calculate</button>

        <div class="result-box" id="resultBox"></div>
    </div>

    <script>
        // price list for all products
        const prices = {
            rice: 500,
            tea: 700,
            coffee: 800,
            pasta: 1000,
            bread: 250
        };

        // simple emoji "image" for each product
        const icons = {
            rice: "🍚",
            tea: "🍵",
            coffee: "☕",
            pasta: "🍝",
            bread: "🍞"
        };

        function buyNow() {
            const menuCard = document.getElementById("menuCard");

            // change background color of the card after clicking Buy Now
            menuCard.style.backgroundColor = "#c8e6c9";

            // after a short pause, hide the menu and show the order form
            setTimeout(function () {
                menuCard.style.display = "none";
                document.getElementById("orderSection").style.display = "block";
            }, 500);
        }

        function calculateTotal() {
            const nameInput = document.getElementById("productName").value.trim().toLowerCase();
            const qty = Number(document.getElementById("quantity").value);
            const resultBox = document.getElementById("resultBox");

            // validate product name
            if (!prices.hasOwnProperty(nameInput)) {
                resultBox.innerHTML = "<p>Please enter a valid product (rice, tea, coffee, pasta, bread)</p>";
                return;
            }

            // validate quantity
            if (!qty || qty <= 0) {
                resultBox.innerHTML = "<p>Please enter a valid quantity</p>";
                return;
            }

            const total = prices[nameInput] * qty;

            resultBox.innerHTML =
                '<div class="round-img">' + icons[nameInput] + '</div>' +
                '<p>Your total amount is: ₹' + total + '</p>';
        }
    </script>

</body>
</html>
